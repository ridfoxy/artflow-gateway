# ZERO-UI AKTIF (3 Okt 2026).
# Awalnya dimatikan karena hook token (window.fetch/XHR) tidak jalan di
# Firefox. Setelah token diambil lewat event Playwright, harvest_token
# BERHASIL di Camoufox -> zero-UI bisa dipakai (lebih cepat, tanpa UI).
# Kalau bermasalah: ubah VIDS_ZERO_UI=1 + VIDS_PORTRAIT_ZEROUI=1 lalu restart.
[Service]
Environment=VIDS_ZERO_UI=1
Environment=VIDS_PORTRAIT_ZEROUI=1
