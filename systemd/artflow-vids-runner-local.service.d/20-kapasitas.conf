# Kapasitas runner Vids untuk mesin 6 core / 16 GB ini.
# Bawaan lama (1/1) berasal dari mesin 2-core/4GB dan membuat job saling
# menunggu ("menunggu slot akun di Google") padahal mesin lega.
# Terukur: ~1,5 GB per konteks Chrome -> 8 konteks ~12 GB, sisa ~3 GB.
[Service]
Environment=VIDS_MAX_CONCURRENT=8
Environment=VIDS_MAX_CONTEXTS=8
Environment=VIDS_PARALLEL=3
Environment=VIDS_SESSION_JOBS=60
